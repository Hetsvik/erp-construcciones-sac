<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio - Dashboard</title>
    <link rel="stylesheet" href="css/inicio.css">
</head>

<body>
    <!-- Fondo animado en capa base -->
    <canvas id="gold-wave-canvas"></canvas>

    <div class="app-layout">
        <!-- Barra lateral -->
        <aside class="sidebar">
            <div class="profile-section">
                <div class="profile-icon">
                    <!-- Icono de usuario -->
                    <svg viewBox="0 0 24 24" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
                <p class="greeting">Bienvenido Rodrigo</p>
            </div>

            <nav class="nav-menu">
                <a href="#" class="nav-link is-active">Inicio</a>
                <a href="#" class="nav-link">Anuncios</a>
                <a href="#" class="nav-link">Calendario</a>
                <a href="#" class="nav-link">Cuenta</a>
                <a href="#" class="nav-link">Configuracion</a>
                <a href="#" class="nav-link">Cerrar Sesion</a>
            </nav>
        </aside>

        <!-- Contenido Principal -->
        <main class="main-content">
            <header class="top-header">
                <h1 class="page-title">INICIO</h1>

                <!-- Campana de notificaciones -->
                <div class="notification-wrapper">
                    <button class="bell-button" id="notification-bell">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                    </button>

                    <!-- Ventana emergente (oculta por defecto) -->
                    <div class="notification-dropdown" id="notification-dropdown">
                        <div class="dropdown-header">Notificaciones</div>
                        <div class="dropdown-body">
                            <p class="empty-notif">No tienes notificaciones nuevas.</p>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Botones centrales de la imagen -->
            <div class="action-boxes">
                <button class="action-box">
                    <div class="box-placeholder">
                        <img src="https://api.iconify.design/lucide:clipboard-check.svg?color=%23d4af37"
                            alt="Icono Asistencia" class="action-icon">
                    </div>
                    <span>Asistencia</span>
                </button>

                <button class="action-box">
                    <div class="box-placeholder">
                        <img src="https://api.iconify.design/lucide:check-square.svg?color=%23d4af37" alt="Icono Tareas"
                            class="action-icon">
                    </div>
                    <span>Tareas</span>
                </button>

                <button class="action-box">
                    <div class="box-placeholder">
                        <img src="https://api.iconify.design/lucide:bar-chart-2.svg?color=%23d4af37"
                            alt="Icono Reportes" class="action-icon">
                    </div>
                    <span>Reportes</span>
                </button>
            </div>
        </main>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
